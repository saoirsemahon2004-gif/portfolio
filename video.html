<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Video Work | Saoirse Mahon</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- ================= HEADER ================= -->

<section class="photo-header">

  <a href="index.html" class="back-home">← Back Home</a>

  <h1>
    Saoirse <span>/</span> <small>Video</small>
  </h1>

  <p class="gallery-description">
    A selection of narrative, experimental, and visual storytelling work in motion.
  </p>

</section>

<!-- ================= PROJECT 1 ================= -->

<section class="project-section">

  <div class="project-info">
    <h2>SALIGIA</h2>
    <p>
      experimental video following the narrative of the seven deadly sins.
    </p>
  </div>

  <div class="video-frame" data-video>

    <iframe
      src="https://www.youtube.com/embed/a5MqNUckIdA?enablejsapi=1&mute=1&controls=1&rel=0"
      title="Project One"
      allow="autoplay; encrypted-media"
      allowfullscreen>
    </iframe>

    <div class="video-overlay">
      Project One
    </div>

  </div>

</section>

<!-- ================= PROJECT 2 ================= -->

<section class="project-section">

  <div class="project-info">
    <h2>Project Two Title</h2>
    <p>
      Short description of the second video project.
    </p>
  </div>

  <div class="video-frame" data-video>

    <iframe
      src="https://www.youtube.com/embed/YOUR_SECOND_VIDEO_ID?enablejsapi=1&mute=1&controls=1&rel=0"
      title="Project Two"
      allow="autoplay; encrypted-media"
      allowfullscreen>
    </iframe>

    <div class="video-overlay">
      Project Two
    </div>

  </div>

</section>

<!-- ================= HOVER AUTOPLAY ================= -->

<script>
const frames = document.querySelectorAll('.video-frame');

frames.forEach(frame => {

  const iframe = frame.querySelector('iframe');

  frame.addEventListener('mouseenter', () => {
    iframe.contentWindow.postMessage(
      '{"event":"command","func":"playVideo","args":""}',
      '*'
    );
  });

  frame.addEventListener('mouseleave', () => {
    iframe.contentWindow.postMessage(
      '{"event":"command","func":"pauseVideo","args":""}',
      '*'
    );
  });

});
</script>

</body>
</html>
