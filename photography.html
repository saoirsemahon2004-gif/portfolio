<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Photography | Saoirse Mahon</title>

  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">
</head>

<body>

<!-- ================= HEADER ================= -->

<p id="header">
  Saoirse
  <span id="break">/</span>
  <span id="folio">Photography</span>
</p>

<p class="gallery-description">
  A selection of portrait, editorial, and visual storytelling work.
</p>

<!-- ================= GALLERY WRAPPER ================= -->

<div class="photo-gallery">

  <!-- IMAGE 1 -->
  <input type="checkbox" class="btnControlers" id="btnControl0"/>
  <label class="btn" for="btnControl0">
    <div>
      <img src="purple.png" alt="Portrait Photography">
      <p class="all">Portraits</p>
    </div>
  </label>

  <!-- IMAGE 2 -->
  <input type="checkbox" class="btnControlers" id="btnControl1"/>
  <label class="btn" for="btnControl1">
    <div>
      <img src="orange.png" alt="Editorial Photography">
      <p class="all middle">Editorial</p>
    </div>
  </label>

  <!-- IMAGE 3 -->
  <input type="checkbox" class="btnControlers" id="btnControl2"/>
  <label class="btn" for="btnControl2">
    <div>
      <img src="green.png" alt="Creative Photography">
      <p class="all">Creative</p>
    </div>
  </label>

  <!-- IMAGE 4 -->
  <input type="checkbox" class="btnControlers" id="btnControl3"/>
  <label class="btn" for="btnControl3">
    <div>
      <img src="pink.png" alt="Film Photography">
      <p class="all">Film</p>
    </div>
  </label>

  <!-- IMAGE 5 -->
  <input type="checkbox" class="btnControlers" id="btnControl4"/>
  <label class="btn" for="btnControl4">
    <div>
      <img src="yellow.png" alt="Fashion Photography">
      <p class="all middle">Fashion</p>
    </div>
  </label>

  <!-- IMAGE 6 -->
  <input type="checkbox" class="btnControlers" id="btnControl5"/>
  <label class="btn" for="btnControl5">
    <div>
      <img src="blue.png" alt="Street Photography">
      <p class="all">Street</p>

       <!-- IMAGE 7 -->
  <input type="checkbox" class="btnControlers" id="btnControl5"/>
  <label class="btn" for="btnControl5">
    <div>
      <img src="red.png" alt="Street Photography">
      <p class="all">Street</p>
    </div>
  </label>

</div>

</body>
</html>
